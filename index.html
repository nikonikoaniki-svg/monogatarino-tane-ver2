<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="5,000のことばと有名な物語を組み合わせて、新しい物語の種を見つける創作支援アプリです。" />
    <meta name="theme-color" content="#f7f1e5" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="物語の種 ver2" />
    <meta property="og:title" content="物語の種 ver2" />
    <meta property="og:description" content="9つのことばと、もうひとつの種から、新しい物語を。" />
    <meta property="og:image" content="og-image-v2.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>物語の種 ver2</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="paper-grain" aria-hidden="true"></div>
      <section class="seed-maker" aria-labelledby="page-title">
        <header class="title-block">
          <p class="eyebrow">STORY SEED MAKER</p>
          <h1 id="page-title">物語の種</h1>
          <span class="version">ver2</span>
          <p class="lead">9つのことばと、もうひとつの種から。</p>
        </header>

        <p class="hint">ことばにふれると、意味が見られます。</p>
        <div id="seed-grid" class="seed-grid" aria-busy="true" aria-label="物語の種となる9つのことば"></div>

        <section id="story-card" class="story-card is-empty" aria-labelledby="story-heading">
          <p id="story-heading" class="story-kicker">もうひとつの種</p>
          <p id="story-title" class="story-title">『？』</p>
          <p id="story-pattern" class="story-pattern">ボタンを押すと、ここに物語が現れます。</p>
          <p class="story-guide">主人公、場所、道具、目的、結末などを、<br class="mobile-break" />上のことばで自由に変えてみよう。</p>
        </section>

        <p class="after-note">ひとつ選んでも、いくつか組み合わせてもかまいません。</p>

        <button id="make-button" class="make-button" type="button" disabled>
          <span class="button-mark" aria-hidden="true">✦</span>
          <span id="button-label">種を準備しています…</span>
        </button>

        <div id="reroll-buttons" class="reroll-buttons" hidden>
          <button id="words-button" class="reroll-button" type="button">ことばだけ回す</button>
          <button id="story-button" class="reroll-button" type="button">物語だけ回す</button>
        </div>
        <p id="announcement" class="sr-only" aria-live="polite"></p>
        <p id="load-error" class="load-error" hidden>データを読み込めませんでした。words.jsonとstories.jsonがindex.htmlと同じ場所にあるか確認してください。</p>
      </section>
    </main>

    <div id="meaning-tooltip" class="meaning-tooltip" role="tooltip" hidden>
      <span class="meaning-label">ことばの意味</span>
      <span id="meaning-text"></span>
    </div>
    <script src="script.js"></script>
  </body>
</html>
